<!DOCTYPE html>
<html>
<head>
    <title>Painel de Aprovação</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #1a1a1a; color: white; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { border: 1px solid #333; padding: 10px; background: #222; border-radius: 8px; }
        img { width: 100%; height: 150px; object-fit: cover; border-radius: 4px; }
        .btn-ok { background: #16a34a; color: white; padding: 8px; text-decoration: none; display: inline-block; margin-top: 10px; border-radius: 4px; }
        .btn-no { background: #dc2626; color: white; padding: 8px; text-decoration: none; display: inline-block; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Fotos Pendentes para Validar</h1>
    <a href="/" style="color: #60a5fa;">⬅ Sair do Painel e Voltar ao Site</a>
    <hr>
    <div class="grid">
        {% for post in posts %}
        <div class="card">
            <img src="{{ post.url }}">
            <p>{{ post.title }}</p>
            <a href="/aprovar/{{ post.id }}" class="btn-ok">APROVAR ✅</a>
            <a href="/recusar/{{ post.id }}" class="btn-no">RECUSAR ❌</a>
        </div>
        {% endfor %}
    </div>
</body>
</html>
