<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Husba51n</title>
    <style>
        :root { --primary: #a78bfa; --bg: #f5f3ff; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #4c1d95; }
        .header { display: flex; flex-direction: column; align-items: center; background: white; padding: 20px; border-radius: 15px; margin-bottom: 20px; }
        .logo { width: 120px; margin-bottom: 10px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .card { background: white; border-radius: 15px; overflow: hidden; text-align: center; padding-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer; }
        
        /* MODAL COM COMENTÁRIOS */
        .modal { display: none; position: fixed; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); flex-direction: column; align-items: center; overflow-y: auto; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 500px; border-radius: 15px; overflow: hidden; margin-top: 20px; }
        .modal-content img { width: 100%; }
        .comment-section { padding: 20px; text-align: left; }
        .close-btn { color: white; font-size: 30px; align-self: flex-end; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <img src="/static/logo.png" class="logo" onerror="this.src='https://via.placeholder.com/120'">
        <h1>Husba51n</h1>
    </div>

    <div style="background: white; padding: 20px; border-radius: 15px; margin-bottom: 25px;">
        <form action="/upload" method="POST" enctype="multipart/form-data">
            <input type="text" name="title" placeholder="Título" required style="width:90%; padding:10px; margin-bottom:10px;">
            <input type="file" name="file" accept="image/*" required>
            <button type="submit" style="background:var(--primary); color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; width:100%; margin-top:10px;">Publicar</button>
        </form>
    </div>

    <div class="gallery">
        {% for post in posts %}
        <div class="card">
            <img src="{{ post.url }}" onclick="openModal('{{ post.url }}', '{{ post.title }}', {{ post.comments | tojson }}, '{{ post.id }}')">
            <p><strong>{{ post.title }}</strong></p>
        </div>
        {% endfor %}
    </div>

    <div id="imageModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="imgExpanded">
            <div class="comment-section">
                <h3 id="modalTitle"></h3>
                <hr>
                <div id="modalComments"></div>
                <form id="commentForm" method="POST" style="margin-top:15px; display:flex; gap:5px;">
                    <input type="text" name="comment" placeholder="Escreva um comentário..." required style="flex:1; padding:8px;">
                    <button type="submit" style="background:var(--primary); color:white; border:none; padding:8px 15px; border-radius:5px;">➤</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openModal(url, title, comments, id) {
            document.getElementById('imgExpanded').src = url;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('commentForm').action = "/comment/" + id;
            
            let list = document.getElementById('modalComments');
            list.innerHTML = "";
            comments.forEach(c => {
                let div = document.createElement('div');
                div.style = "background:#f5f3ff; padding:8px; margin-top:5px; border-radius:8px; border-left:3px solid #a78bfa";
                div.innerText = c;
                list.appendChild(div);
            });

            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }
    </script>
</body>
</html>
